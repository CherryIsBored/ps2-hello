name: build-ps2
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - name: Dependencias básicas (la imagen es Alpine)
        run: apk add --no-cache build-base git
      - uses: actions/checkout@v4
      - name: Compilar
        run: make clean all
      - uses: actions/upload-artifact@v4
        with:
          name: hello-elf
          path: hello.elf
